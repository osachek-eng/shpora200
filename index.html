<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика ЕГЭ: Умный тренажер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .katex-display { margin: 1em 0 !important; font-size: 1.3em; }
        .success-flash { animation: success-bg 0.6s ease; }
        .error-flash { animation: error-bg 0.6s ease; }
        @keyframes success-bg { 0%, 100% { background-color: white; } 50% { background-color: #f0fdf4; } }
        @keyframes error-bg { 0%, 100% { background-color: white; } 50% { background-color: #fef2f2; } }
        .constructor-block { transition: all 0.2s; user-select: none; position: relative; }
        .hint-pulse { animation: hint-pulse-animation 2s infinite; border-color: #22c55e !important; background-color: #f0fdf4 !important; }
        @keyframes hint-pulse-animation { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-5xl mx-auto px-4 py-4 md:py-8">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 gap-4">
            <div>
                <h1 class="text-3xl font-extrabold tracking-tight text-slate-900">200 Формул ЕГЭ</h1>
                <p class="text-slate-500 font-medium italic">Исправленный режим сборки</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl px-6 py-2 shadow-sm text-center">
                <div class="text-2xl font-bold text-blue-600" id="score">0</div>
                <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400">Очки</div>
            </div>
        </header>

        <div id="category-section" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-4">
            <button onclick="setCategory('all')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-slate-900 text-white shadow-lg">Все темы</button>
            <button onclick="setCategory('механика')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white border border-slate-200 hover:bg-blue-50">Механика</button>
            <button onclick="setCategory('мкт')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white border border-slate-200 hover:bg-blue-50">МКТ и Термо</button>
            <button onclick="setCategory('электро')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white border border-slate-200 hover:bg-blue-50">Электродинамика</button>
            <button onclick="setCategory('оптика')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-sm font-semibold transition-all bg-white border border-slate-200 hover:bg-blue-50">Оптика</button>
        </div>

        <main id="main-card" class="bg-white border border-slate-200 rounded-[2.5rem] p-6 md:p-10 shadow-xl min-h-[550px] flex flex-col justify-center relative overflow-hidden">
            <div id="task-container" class="opacity-100 transition-opacity duration-300"></div>
            
            <div id="feedback" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 backdrop-blur-md z-20 text-center p-6">
                <div id="feedback-icon" class="text-7xl mb-4"></div>
                <div id="feedback-correct" class="w-full"></div>
                <button id="feedback-btn" class="mt-8 bg-slate-900 text-white px-12 py-4 rounded-2xl font-bold shadow-xl hover:scale-105 transition-transform">ПРОДОЛЖИТЬ</button>
            </div>
        </main>

        <div class="mt-6 flex flex-wrap justify-between items-center gap-4 px-2">
            <div class="flex items-center gap-3">
                <span class="px-3 py-1 bg-slate-200 text-slate-600 rounded-full text-[10px] font-bold uppercase tracking-widest" id="task-type-label">...</span>
                <div id="hint-badge" class="hidden bg-emerald-500 text-white text-[10px] font-bold px-3 py-1 rounded-full uppercase tracking-widest">Этап: Закрепление (с подсказкой)</div>
            </div>
        </div>
    </div>

    <script>
        const FORMULAS_DB = [
            { name: "Скорость", formula: "v = \\frac{s}{t}", parts: ["v", "=", "s", "/", "t"], category: "механика" },
            { name: "Ускорение", formula: "a = \\frac{v - v_0}{t}", parts: ["a", "=", "v", "-", "v_0", "/", "t"], category: "механика" },
            { name: "Закон Кулона", formula: "F = k \\frac{q_1 q_2}{r^2}", parts: ["F", "=", "k", "q_1", "q_2", "/", "r^2"], category: "электро" },
            { name: "Сила Архимеда", formula: "F_A = \\rho g V", parts: ["F_A", "=", "\\rho", "g", "V"], category: "механика" },
            { name: "Импульс", formula: "p = m v", parts: ["p", "=", "m", "v"], category: "механика" }
        ];

        let state = {
            score: 0,
            category: 'all',
            currentTask: null,
            mode: 1, // Всегда конструктор для теста исправления
            selectedBlocks: [],
            repeatQueue: [],
            isHintMode: false
        };

        function setCategory(cat) {
            state.category = cat;
            state.repeatQueue = [];
            document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('bg-slate-900', 'text-white'));
            event.currentTarget.classList.add('bg-slate-900', 'text-white');
            nextTask();
        }

        function nextTask() {
            const container = document.getElementById('task-container');
            const hintBadge = document.getElementById('hint-badge');
            container.style.opacity = '0';

            setTimeout(() => {
                if (state.repeatQueue.length > 0) {
                    const item = state.repeatQueue.shift();
                    state.currentTask = item.formula;
                    state.isHintMode = (item.stage === 'hint');
                    state.mode = item.mode;
                    if (state.isHintMode) {
                        hintBadge.classList.remove('hidden');
                        state.repeatQueue.push({ formula: item.formula, mode: item.mode, stage: 'check' });
                    }
                } else {
                    state.isHintMode = false;
                    hintBadge.classList.add('hidden');
                    const pool = state.category === 'all' ? FORMULAS_DB : FORMULAS_DB.filter(f => f.category === state.category);
                    state.currentTask = pool[Math.floor(Math.random() * pool.length)];
                    state.mode = 1; // Оставим 1 для теста конструктора
                }

                state.selectedBlocks = [];
                renderUI();
                container.style.opacity = '1';
            }, 200);
        }

        function renderUI() {
            const container = document.getElementById('task-container');
            const label = document.getElementById('task-type-label');
            label.innerText = "РЕЖИМ: КОНСТРУКТОР";
            
            container.innerHTML = `
                <div class="text-center space-y-6">
                    <div class="text-blue-500 font-bold tracking-widest text-xs uppercase">Соберите формулу:</div>
                    <h2 class="text-2xl font-bold text-slate-800">${state.currentTask.name}</h2>
                    <div id="drop-zone" class="min-h-[100px] bg-slate-50 border-2 border-dashed border-slate-200 rounded-3xl flex flex-wrap justify-center items-center gap-2 p-6 transition-colors">
                        <span class="text-slate-300 italic text-sm" id="empty-hint">Нажимайте на блоки ниже...</span>
                    </div>
                    <div id="block-pool" class="flex flex-wrap justify-center gap-3 mt-8"></div>
                    <div class="pt-8 flex justify-center gap-4">
                        <button onclick="clearDropZone()" class="px-6 py-4 rounded-2xl font-bold text-slate-400 hover:text-red-500 transition-colors">Сброс</button>
                        <button onclick="checkConstructor()" class="w-full max-w-xs bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-700 shadow-lg active:scale-95 transition-all">ПРОВЕРИТЬ</button>
                    </div>
                </div>
            `;
            renderBlocks();
        }

        function renderBlocks() {
            const pool = document.getElementById('block-pool');
            let items = [...state.currentTask.parts];
            const noise = ["m", "t", "2", "R", "x", "y", "0", "V", "k", "G"];
            while(items.length < 10) {
                let n = noise[Math.floor(Math.random() * noise.length)];
                if(!items.includes(n)) items.push(n);
            }
            items.sort(() => 0.5 - Math.random());
            
            pool.innerHTML = items.map(item => {
                const isCorrect = state.currentTask.parts.includes(item);
                let hintStyles = "";
                let orderBadge = "";
                
                if (state.isHintMode && isCorrect) {
                    hintStyles = "hint-pulse border-emerald-500 text-emerald-700";
                    // Находим позицию этого блока в оригинальной формуле для подсказки порядка
                    const order = state.currentTask.parts.indexOf(item) + 1;
                    orderBadge = `<span class="absolute -top-2 -right-2 bg-emerald-500 text-white text-[10px] w-5 h-5 rounded-full flex items-center justify-center border-2 border-white shadow-sm">${order}</span>`;
                }

                return `
                    <button onclick="addBlock('${item}')" class="constructor-block border-2 border-slate-100 bg-white px-5 py-3 rounded-xl text-lg font-mono font-bold shadow-sm hover:border-blue-300 ${hintStyles}">
                        ${orderBadge}
                        ${item}
                    </button>
                `;
            }).join('');
        }

        function addBlock(val) {
            document.getElementById('empty-hint')?.remove();
            state.selectedBlocks.push(val);
            const drop = document.getElementById('drop-zone');
            const el = document.createElement('div');
            el.className = "bg-blue-600 text-white px-4 py-2 rounded-xl font-mono text-lg font-bold cursor-pointer hover:bg-blue-700 animate-in zoom-in duration-200";
            el.innerText = val;
            el.onclick = () => {
                const idx = state.selectedBlocks.lastIndexOf(val);
                if (idx > -1) state.selectedBlocks.splice(idx, 1);
                el.remove();
                if(state.selectedBlocks.length === 0) drop.innerHTML = '<span class="text-slate-300 italic text-sm" id="empty-hint">Нажимайте на блоки ниже...</span>';
            };
            drop.appendChild(el);
        }

        function clearDropZone() {
            state.selectedBlocks = [];
            const drop = document.getElementById('drop-zone');
            drop.innerHTML = '<span class="text-slate-300 italic text-sm" id="empty-hint">Нажимайте на блоки ниже...</span>';
        }

        function checkConstructor() {
            // Исправленная логика сравнения:
            // 1. Убираем пробелы и лишние символы
            // 2. Сравниваем массив строк напрямую
            const result = state.selectedBlocks.join('').trim();
            const correct = state.currentTask.parts.join('').trim();
            
            verify(result === correct);
        }

        function verify(isCorrect) {
            const card = document.getElementById('main-card');
            const feedback = document.getElementById('feedback');
            const icon = document.getElementById('feedback-icon');
            const msg = document.getElementById('feedback-correct');
            const btn = document.getElementById('feedback-btn');

            if (isCorrect) {
                state.score += 20;
                card.classList.add('success-flash');
                icon.innerHTML = "🎯";
                msg.innerHTML = `<h3 class="text-2xl font-bold text-green-600">Верно!</h3><p class="text-slate-500 font-medium">Отличная работа</p>`;
                btn.onclick = () => { feedback.classList.add('hidden'); nextTask(); };
                setTimeout(() => { if(!feedback.classList.contains('hidden')) { feedback.classList.add('hidden'); nextTask(); } }, 1500);
            } else {
                state.score = Math.max(0, state.score - 10);
                state.repeatQueue = [{ formula: state.currentTask, mode: 1, stage: 'hint' }];
                card.classList.add('error-flash');
                icon.innerHTML = "🤔";
                msg.innerHTML = `
                    <div class="space-y-4">
                        <h3 class="text-2xl font-bold text-red-600">Почти получилось!</h3>
                        <p class="text-slate-400">Верный ответ:</p>
                        <div class="bg-slate-50 p-6 rounded-3xl" id="correct-render"></div>
                        <div class="bg-emerald-50 text-emerald-700 p-4 rounded-xl text-sm border border-emerald-100">
                            В режиме закрепления мы добавили номера на зеленых блоках. Собирайте их по порядку!
                        </div>
                    </div>
                `;
                btn.onclick = () => { feedback.classList.add('hidden'); nextTask(); };
                setTimeout(() => katex.render(state.currentTask.formula, document.getElementById('correct-render'), { displayMode: true }), 10);
            }

            document.getElementById('score').innerText = state.score;
            feedback.classList.remove('hidden');
            setTimeout(() => card.classList.remove('success-flash', 'error-flash'), 600);
        }

        window.onload = nextTask;
    </script>
</body>
</html>
