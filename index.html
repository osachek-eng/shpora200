<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика ЕГЭ: Полный тренажер</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; overflow-x: hidden; }
        .katex-display { margin: 1em 0 !important; font-size: 1.5em; }
        .constructor-block { transition: all 0.2s; user-select: none; position: relative; cursor: pointer; }
        .hint-pulse { animation: hint-pulse-animation 2s infinite; border-color: #22c55e !important; background-color: #f0fdf4 !important; }
        @keyframes hint-pulse-animation { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(34, 197, 94, 0.2); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .success-flash { animation: success-bg 0.6s ease; }
        @keyframes success-bg { 0%, 100% { background-color: white; } 50% { background-color: #f0fdf4; } }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-4xl mx-auto px-4 py-4 md:py-6">
        <!-- Header -->
        <header class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black text-slate-900 leading-tight">200 ФОРМУЛ</h1>
                <p class="text-slate-400 text-xs font-bold uppercase tracking-widest">Тренажер ЕГЭ по Физике</p>
            </div>
            <div class="bg-white border-2 border-slate-100 rounded-2xl px-5 py-2 shadow-sm">
                <div class="text-xl font-black text-blue-600" id="score">0</div>
                <div class="text-[9px] uppercase font-bold text-slate-400 tracking-tighter text-center">Очки</div>
            </div>
        </header>

        <!-- Category Selector -->
        <div class="flex gap-2 overflow-x-auto pb-4 no-scrollbar mb-4" id="cat-list">
            <button onclick="setCategory('all')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all bg-slate-900 text-white">ВСЕ ТЕМЫ</button>
            <button onclick="setCategory('кинематика')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white border border-slate-200">КИНЕМАТИКА</button>
            <button onclick="setCategory('динамика')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white border border-slate-200">ДИНАМИКА</button>
            <button onclick="setCategory('мкт')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white border border-slate-200">МКТ</button>
            <button onclick="setCategory('электро')" class="cat-btn shrink-0 px-4 py-2 rounded-xl text-xs font-bold transition-all bg-white border border-slate-200">ЭЛЕКТРО</button>
        </div>

        <!-- Main Workspace -->
        <main id="main-card" class="bg-white border-2 border-slate-100 rounded-[2rem] p-6 md:p-8 shadow-xl min-h-[500px] flex flex-col relative transition-all">
            <div id="task-ui" class="flex-1 flex flex-col"></div>
            
            <!-- Result Overlay -->
            <div id="feedback" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm z-30 text-center p-8 rounded-[2rem]">
                <div id="feedback-icon" class="text-6xl mb-4 animate-bounce"></div>
                <div id="feedback-text" class="mb-6"></div>
                <button id="feedback-btn" class="bg-slate-900 text-white px-10 py-4 rounded-2xl font-black shadow-lg hover:bg-slate-800 transition-all active:scale-95">СЛЕДУЮЩАЯ</button>
            </div>
        </main>
        
        <div id="hint-msg" class="hidden mt-4 text-center">
            <span class="bg-emerald-500 text-white text-[10px] font-black px-4 py-1.5 rounded-full uppercase tracking-widest shadow-sm">Режим закрепления: следуй за номерами</span>
        </div>
    </div>

    <script>
        // БАЗА ДАННЫХ ФОРМУЛ (Разделы из вашей шпоры)
        const DB = [
            // МЕХАНИКА: Кинематика
            { name: "Перемещение (ось x)", formula: "S = x - x_0", parts: ["S", "=", "x", "-", "x_0"], cat: "кинематика" },
            { name: "Скорость", formula: "v = \\frac{\\Delta x}{\\Delta t}", parts: ["v", "=", "\\Delta x", "/", "\\Delta t"], cat: "кинематика" },
            { name: "Ускорение", formula: "a = \\frac{\\Delta v}{\\Delta t}", parts: ["a", "=", "\\Delta v", "/", "\\Delta t"], cat: "кинематика" },
            { name: "Равнопеременное движение", formula: "x = x_0 + v_0 t + \\frac{a t^2}{2}", parts: ["x", "=", "x_0", "+", "v_0 t", "+", "a t^2 / 2"], cat: "кинематика" },
            { name: "Центростремительное ускорение", formula: "a_{ц} = \\frac{v^2}{R}", parts: ["a_{ц}", "=", "v^2", "/", "R"], cat: "кинематика" },
            
            // МЕХАНИКА: Динамика и Статика
            { name: "Второй закон Ньютона", formula: "F = m a", parts: ["F", "=", "m", "a"], cat: "динамика" },
            { name: "Закон всемирного тяготения", formula: "F = G \\frac{m_1 m_2}{r^2}", parts: ["F", "=", "G", "m_1 m_2", "/", "r^2"], cat: "динамика" },
            { name: "Сила упругости (Закон Гука)", formula: "F_{упр} = k |\\Delta x|", parts: ["F_{упр}", "=", "k", "|\\Delta x|"], cat: "динамика" },
            { name: "Сила Архимеда", formula: "F_А = \\rho g V", parts: ["F_А", "=", "\\rho", "g", "V"], cat: "динамика" },
            
            // МКТ
            { name: "Основное уравнение МКТ", formula: "p = \\frac{1}{3} n m_0 v^2", parts: ["p", "=", "1/3", "n", "m_0", "v^2"], cat: "мкт" },
            { name: "Уравнение Менделеева-Клапейрона", formula: "p V = \\nu R T", parts: ["p", "V", "=", "\\nu", "R", "T"], cat: "мкт" },
            { name: "Средняя энергия молекул", formula: "E = \\frac{3}{2} k T", parts: ["E", "=", "3/2", "k", "T"], cat: "мкт" },
            
            // ЭЛЕКТРОСТАТИКА
            { name: "Закон Кулона", formula: "F = k \\frac{|q_1 q_2|}{r^2}", parts: ["F", "=", "k", "q_1 q_2", "/", "r^2"], cat: "электро" },
            { name: "Напряженность поля", formula: "E = \\frac{F}{q}", parts: ["E", "=", "F", "/", "q"], cat: "электро" }
        ];

        let state = {
            score: 0,
            category: 'all',
            task: null,
            userParts: [],
            isHint: false,
            repeatTask: null
        };

        function setCategory(c) {
            state.category = c;
            state.repeatTask = null;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.classList.replace('bg-slate-900', 'bg-white');
                b.classList.replace('text-white', 'text-slate-800');
            });
            event.target.classList.replace('bg-white', 'bg-slate-900');
            event.target.classList.replace('text-slate-800', 'text-white');
            next();
        }

        function next() {
            const ui = document.getElementById('task-ui');
            const hintMsg = document.getElementById('hint-msg');
            ui.innerHTML = '';
            
            if (state.repeatTask) {
                state.task = state.repeatTask;
                state.isHint = true;
                state.repeatTask = null;
                hintMsg.classList.remove('hidden');
            } else {
                state.isHint = false;
                hintMsg.classList.add('hidden');
                const pool = state.category === 'all' ? DB : DB.filter(f => f.cat === state.category);
                state.task = pool[Math.floor(Math.random() * pool.length)];
            }

            state.userParts = [];
            
            ui.innerHTML = `
                <div class="flex-1 flex flex-col space-y-6">
                    <div class="text-center">
                        <h2 class="text-2xl font-black text-slate-800 mb-1">${state.task.name}</h2>
                        <p class="text-slate-400 text-[10px] font-bold uppercase tracking-widest">Соберите формулу из блоков</p>
                    </div>

                    <div id="drop-zone" class="min-h-[120px] bg-slate-50 border-4 border-dotted border-slate-100 rounded-3xl flex flex-wrap justify-center items-center gap-2 p-6 transition-all">
                        <span class="text-slate-300 font-bold text-sm italic">Перетащите сюда...</span>
                    </div>

                    <div id="pool" class="flex flex-wrap justify-center gap-3 pt-4"></div>

                    <div class="flex gap-3 pt-6">
                        <button onclick="resetDrop()" class="flex-1 bg-slate-100 text-slate-400 py-4 rounded-2xl font-black hover:bg-slate-200 transition-all">СБРОС</button>
                        <button onclick="check()" class="flex-[2] bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg shadow-blue-200 hover:bg-blue-700 active:scale-95 transition-all">ПРОВЕРИТЬ</button>
                    </div>
                </div>
            `;
            renderPool();
        }

        function renderPool() {
            const poolEl = document.getElementById('pool');
            let blocks = [...state.task.parts];
            const noise = ["m", "v", "a", "t", "2", "k", "R", "F", "P", "x", "y", "z", "0"];
            
            while(blocks.length < 10) {
                let n = noise[Math.floor(Math.random() * noise.length)];
                if(!blocks.includes(n)) blocks.push(n);
            }
            blocks.sort(() => 0.5 - Math.random());

            poolEl.innerHTML = blocks.map(val => {
                const idxInFormula = state.task.parts.indexOf(val);
                const isCorrect = idxInFormula !== -1;
                let styles = "bg-white border-2 border-slate-100 text-slate-600";
                let badge = "";

                if (state.isHint && isCorrect) {
                    styles = "hint-pulse border-emerald-400 text-emerald-700 font-bold";
                    badge = `<span class="absolute -top-2 -right-2 w-5 h-5 bg-emerald-500 text-white text-[10px] rounded-full flex items-center justify-center border-2 border-white font-black">${idxInFormula + 1}</span>`;
                }

                return `
                    <div onclick="addToDrop('${val}')" class="constructor-block px-5 py-3 rounded-xl font-mono text-lg shadow-sm ${styles}">
                        ${badge}${val}
                    </div>
                `;
            }).join('');
        }

        function addToDrop(v) {
            document.querySelector('#drop-zone span')?.remove();
            state.userParts.push(v);
            const drop = document.getElementById('drop-zone');
            const el = document.createElement('div');
            el.className = "bg-slate-800 text-white px-4 py-2 rounded-xl font-mono text-lg font-bold animate-in fade-in zoom-in duration-200";
            el.innerText = v;
            el.onclick = () => {
                const i = state.userParts.lastIndexOf(v);
                if(i > -1) state.userParts.splice(i, 1);
                el.remove();
                if(state.userParts.length === 0) drop.innerHTML = '<span class="text-slate-300 font-bold text-sm italic">Перетащите сюда...</span>';
            };
            drop.appendChild(el);
        }

        function resetDrop() {
            state.userParts = [];
            document.getElementById('drop-zone').innerHTML = '<span class="text-slate-300 font-bold text-sm italic">Перетащите сюда...</span>';
        }

        function check() {
            // КРИТИЧЕСКОЕ ИСПРАВЛЕНИЕ: точное сравнение массивов
            const isMatch = JSON.stringify(state.userParts) === JSON.stringify(state.task.parts);
            const overlay = document.getElementById('feedback');
            const icon = document.getElementById('feedback-icon');
            const text = document.getElementById('feedback-text');
            const btn = document.getElementById('feedback-btn');

            if (isMatch) {
                state.score += state.isHint ? 5 : 20;
                document.getElementById('main-card').classList.add('success-flash');
                icon.innerText = "⭐";
                text.innerHTML = `<h3 class="text-2xl font-black text-emerald-600 mb-2">БРАВО!</h3><p class="text-slate-400 font-bold">Формула верна</p>`;
                btn.onclick = () => { overlay.classList.add('hidden'); next(); };
            } else {
                state.score = Math.max(0, state.score - 10);
                state.repeatTask = state.task;
                icon.innerText = "💡";
                text.innerHTML = `
                    <h3 class="text-2xl font-black text-rose-500 mb-2">ОШИБКА</h3>
                    <div id="math-res" class="bg-slate-50 p-4 rounded-2xl mb-2"></div>
                    <p class="text-slate-400 text-xs font-bold uppercase tracking-tighter">Запомни и повтори по номерам!</p>
                `;
                btn.onclick = () => { overlay.classList.add('hidden'); next(); };
                setTimeout(() => katex.render(state.task.formula, document.getElementById('math-res')), 50);
            }

            document.getElementById('score').innerText = state.score;
            overlay.classList.remove('hidden');
            setTimeout(() => document.getElementById('main-card').classList.remove('success-flash'), 600);
        }

        window.onload = next;
    </script>
</body>
</html>
