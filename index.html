<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Физика ЕГЭ: 200 формул</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #fcfcfc; }
        .success-flash { animation: success-bg 0.6s ease; }
        .error-flash { animation: error-bg 0.6s ease; }
        @keyframes success-bg { 0%, 100% { background-color: white; } 50% { background-color: #f0fdf4; } }
        @keyframes error-bg { 0%, 100% { background-color: white; } 50% { background-color: #fef2f2; } }
        .katex-display { margin: 1em 0 !important; font-size: 1.5em; }
        .constructor-block { user-select: none; transition: all 0.1s; cursor: pointer; }
        .constructor-block:active { transform: scale(0.95); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800">
    <div id="app" class="max-w-4xl mx-auto px-4 py-6 md:py-10">
        <!-- Header -->
        <header class="flex justify-between items-end mb-8">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-slate-900">Физика ЕГЭ</h1>
                <p class="text-slate-500 font-medium">Тренажер по шпоре «200 формул»</p>
            </div>
            <div class="bg-white border border-slate-200 rounded-2xl px-6 py-3 shadow-sm text-center">
                <div class="text-3xl font-bold text-blue-600" id="score">0</div>
                <div class="text-[10px] uppercase tracking-widest font-bold text-slate-400">Очки</div>
            </div>
        </header>

        <!-- Categories -->
        <div id="category-section" class="flex gap-2 overflow-x-auto pb-4 no-scrollbar">
            <button onclick="setCategory('all')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-slate-900 text-white shadow-md">Все</button>
            <button onclick="setCategory('механика')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">Механика</button>
            <button onclick="setCategory('мкт')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">МКТ / Термо</button>
            <button onclick="setCategory('электро')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">Электродинамика</button>
            <button onclick="setCategory('магнетизм')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">Магнетизм</button>
            <button onclick="setCategory('оптика')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">Оптика</button>
            <button onclick="setCategory('кванты')" class="cat-btn px-5 py-2 rounded-xl text-sm font-medium transition-all bg-white border border-slate-200 hover:border-blue-400">Кванты</button>
        </div>

        <!-- Main Workspace -->
        <main id="main-card" class="bg-white border border-slate-200 rounded-[2.5rem] p-6 md:p-12 shadow-sm min-h-[480px] flex flex-col justify-center relative overflow-hidden">
            <div id="task-container" class="opacity-100 transition-opacity duration-300"></div>
            
            <div id="feedback" class="hidden absolute inset-0 flex flex-col items-center justify-center bg-white/95 backdrop-blur-sm z-20 transition-all">
                <div id="feedback-icon" class="text-8xl mb-4"></div>
                <div id="feedback-correct" class="text-slate-500 font-medium px-6 text-center"></div>
            </div>
        </main>

        <div class="mt-6 flex justify-between items-center px-4">
            <div class="text-xs text-slate-400 font-medium uppercase tracking-widest" id="task-type-label">Загрузка...</div>
            <button onclick="nextTask()" class="text-sm font-semibold text-blue-600 hover:text-blue-700 flex items-center gap-1">
                Пропустить <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
            </button>
        </div>
    </div>

    <script>
        const FORMULAS_DB = [
            // МЕХАНИКА
            { name: "Перемещение вдоль оси", formula: "S = \\Delta x = x - xo", parts: ["S", "=", "\\Delta x", "=", "x", "-", "xo"], missing: "\\Delta x", category: "механика" },
            { name: "Скорость", formula: "V = \\Delta x / \\Delta t", parts: ["V", "=", "\\Delta x", "/", "\\Delta t"], missing: "V", category: "механика" },
            { name: "Ускорение", formula: "a = \\Delta V / \\Delta t", parts: ["a", "=", "\\Delta V", "/", "\\Delta t"], missing: "a", category: "механика" },
            { name: "Равномерное движение", formula: "x = xo + Vt", parts: ["x", "=", "xo", "+", "Vt"], missing: "Vt", category: "механика" },
            { name: "Равнопеременное движение", formula: "x = xo + Vot + at^2 / 2", parts: ["x", "=", "xo", "+", "Vot", "+", "at^2 / 2"], missing: "at^2 / 2", category: "механика" },
            { name: "Равнопеременное (без t)", formula: "x = xo + (V^2 - Vo^2) / 2a", parts: ["x", "=", "xo", "+", "(V^2 - Vo^2) / 2a"], missing: "Vo^2", category: "механика" },
            { name: "Уравнение скорости", formula: "V = Vo + at", parts: ["V", "=", "Vo", "+", "at"], missing: "at", category: "механика" },
            { name: "Относительная скорость (в одну сторону)", formula: "V_{OTH} = V2 - V1", parts: ["V_{OTH}", "=", "V2", "-", "V1"], missing: "V2 - V1", category: "механика" },
            { name: "Относительная скорость (в разные)", formula: "V_{OTH} = V1 + V2", parts: ["V_{OTH}", "=", "V1", "+", "V2"], missing: "V1 + V2", category: "механика" },
            { name: "Центростремительное ускорение", formula: "aц = V^2 / R", parts: ["aц", "=", "V^2", "/", "R"], missing: "V^2", category: "механика" },
            { name: "Второй закон Ньютона", formula: "F = ma", parts: ["F", "=", "m", "a"], missing: "ma", category: "механика" },
            { name: "Закон всемирного тяготения", formula: "F = G m1 m2 / r^2", parts: ["F", "=", "G", "m1 m2 / r^2"], missing: "r^2", category: "механика" },
            { name: "Сила Архимеда", formula: "Fa = \\rho_{ж} g V_{погр}", parts: ["Fa", "=", "\\rho_{ж}", "g", "V_{погр}"], missing: "V_{погр}", category: "механика" },
            { name: "Работа силы", formula: "A = F S \\cos a", parts: ["A", "=", "F", "S", "\\cos a"], missing: "\\cos a", category: "механика" },
            { name: "Кинетическая энергия", formula: "Eк = mV^2 / 2", parts: ["Eк", "=", "m", "V^2 / 2"], missing: "V^2 / 2", category: "механика" },
            { name: "Потенциальная энергия", formula: "Eп = mgh", parts: ["Eп", "=", "m", "g", "h"], missing: "mgh", category: "механика" },
            { name: "Момент силы", formula: "M = F l", parts: ["M", "=", "F", "l"], missing: "F l", category: "механика" },
            { name: "Период нитяного маятника", formula: "T = 2\\pi \\sqrt{L/g}", parts: ["T", "=", "2\\pi", "\\sqrt{L/g}"], missing: "L/g", category: "механика" },
            { name: "Период пружинного маятника", formula: "T = 2\\pi \\sqrt{m/k}", parts: ["T", "=", "2\\pi", "\\sqrt{m/k}"], missing: "m/k", category: "механика" },

            // МКТ / ТЕРМО
            { name: "Уравнение Менделеева-Клапейрона", formula: "pV = \\nu RT", parts: ["p", "V", "=", "\\nu", "R", "T"], missing: "\\nu RT", category: "мкт" },
            { name: "Основное уравнение МКТ (энергия)", formula: "P = 2/3 n E", parts: ["P", "=", "2/3", "n", "E"], missing: "2/3", category: "мкт" },
            { name: "Давление через температуру", formula: "p = nkT", parts: ["p", "=", "n", "k", "T"], missing: "nkT", category: "мкт" },
            { name: "Внутренняя энергия (1-атомный)", formula: "U = 3/2 \\nu RT", parts: ["U", "=", "3/2", "\\nu", "R", "T"], missing: "3/2", category: "мкт" },
            { name: "Первый закон термодинамики", formula: "Q = \\Delta U + A", parts: ["Q", "=", "\\Delta U", "+", "A"], missing: "\\Delta U", category: "мкт" },
            { name: "КПД тепловой машины", formula: "\\eta = (QH - Qx) / QH", parts: ["\\eta", "=", "(QH - Qx)", "/", "QH"], missing: "Qx", category: "мкт" },
            { name: "Относительная влажность", formula: "\\phi = P / P_{нас}", parts: ["\\phi", "=", "P", "/", "P_{нас}"], missing: "P_{нас}", category: "мкт" },
            { name: "Теплота нагревания", formula: "Q = cm \\Delta t", parts: ["Q", "=", "c", "m", "\\Delta t"], missing: "cm \\Delta t", category: "мкт" },
            { name: "Теплота парообразования", formula: "Q = Lm", parts: ["Q", "=", "L", "m"], missing: "Lm", category: "мкт" },

            // ЭЛЕКТРО
            { name: "Закон Кулона", formula: "F = kqQ / \\epsilon r^2", parts: ["F", "=", "k", "qQ / \\epsilon r^2"], missing: "r^2", category: "электро" },
            { name: "Напряженность точ. заряда", formula: "E = kq / r^2", parts: ["E", "=", "k", "q / r^2"], missing: "r^2", category: "электро" },
            { name: "Электроемкость", formula: "C = q / U", parts: ["C", "=", "q", "/", "U"], missing: "q/U", category: "электро" },
            { name: "Емкость плоского конд.", formula: "C = \\epsilon \\epsilon_0 S / d", parts: ["C", "=", "\\epsilon \\epsilon_0 S", "/", "d"], missing: "d", category: "электро" },
            { name: "Закон Ома (участок)", formula: "I = U / R", parts: ["I", "=", "U", "/", "R"], missing: "R", category: "электро" },
            { name: "Закон Ома (полная цепь)", formula: "I = E / (R+r)", parts: ["I", "=", "E", "/", "(R+r)"], missing: "r", category: "электро" },
            { name: "Сопротивление", formula: "R = \\rho L / S", parts: ["R", "=", "\\rho", "L", "/", "S"], missing: "\\rho", category: "электро" },
            { name: "Мощность тока", formula: "P = UI", parts: ["P", "=", "U", "I"], missing: "UI", category: "электро" },
            { name: "Закон Джоуля-Ленца", formula: "Q = I^2 R t", parts: ["Q", "=", "I^2", "R", "t"], missing: "I^2 R t", category: "электро" },

            // МАГНЕТИЗМ
            { name: "Сила Ампера", formula: "Fa = IBL \\sin a", parts: ["Fa", "=", "I", "B", "L", "\\sin a"], missing: "Fa", category: "магнетизм" },
            { name: "Сила Лоренца", formula: "Fn = qVB \\sin a", parts: ["Fn", "=", "q", "V", "B", "\\sin a"], missing: "Fn", category: "магнетизм" },
            { name: "Магнитный поток", formula: "\\Phi = BS \\cos a", parts: ["\\Phi", "=", "B", "S", "\\cos a"], missing: "\\cos a", category: "магнетизм" },
            { name: "Закон ЭМ индукции", formula: "Ei = -\\Delta \\Phi / \\Delta t", parts: ["Ei", "=", "-", "\\Delta \\Phi / \\Delta t"], missing: "\\Delta \\Phi", category: "магнетизм" },
            { name: "Период (формула Томсона)", formula: "T = 2\\pi \\sqrt{LC}", parts: ["T", "=", "2\\pi", "\\sqrt{LC}"], missing: "LC", category: "магнетизм" },

            // ОПТИКА
            { name: "Закон Снеллиуса", formula: "n_1 \\sin a = n_2 \\sin b", parts: ["n_1 \\sin a", "=", "n_2 \\sin b"], missing: "\\sin b", category: "оптика" },
            { name: "Формула тонкой линзы", formula: "1 / F = 1 / d + 1 / f", parts: ["1/F", "=", "1/d", "+", "1/f"], missing: "1/f", category: "оптика" },
            { name: "Линейное увеличение", formula: "\\Gamma = f / d", parts: ["\\Gamma", "=", "f", "/", "d"], missing: "f/d", category: "оптика" },
            { name: "Дифракционная решетка", formula: "d \\sin a = k \\lambda", parts: ["d \\sin a", "=", "k \\lambda"], missing: "k \\lambda", category: "оптика" },

            // КВАНТЫ
            { name: "Энергия фотона", formula: "E\\phi = hv", parts: ["E\\phi", "=", "h", "v"], missing: "hv", category: "кванты" },
            { name: "Фотоэффект (Эйнштейн)", formula: "E\\phi = A_{вых} + E_{кmax}", parts: ["E\\phi", "=", "A_{вых}", "+", "E_{кmax}"], missing: "A_{вых}", category: "кванты" },
            { name: "Импульс фотона", formula: "p = h / \\lambda", parts: ["p", "=", "h", "/", "\\lambda"], missing: "h/\\lambda", category: "кванты" },
            { name: "Закон полураспада", formula: "N = No \\cdot 2^{-t/T}", parts: ["N", "=", "No", "\\cdot", "2^{-t/T}"], missing: "2^{-t/T}", category: "кванты" }
        ];

        let state = {
            category: 'all',
            score: 0,
            currentTask: null,
            mode: 0, 
            selectedBlocks: []
        };

        function setCategory(cat) {
            state.category = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white', 'shadow-md');
                btn.classList.add('bg-white', 'text-slate-800', 'border-slate-200');
            });
            event.currentTarget.classList.replace('bg-white', 'bg-slate-900');
            event.currentTarget.classList.replace('text-slate-800', 'text-white');
            nextTask();
        }

        function nextTask() {
            const container = document.getElementById('task-container');
            container.style.opacity = '0';
            
            setTimeout(() => {
                const pool = state.category === 'all' 
                    ? FORMULAS_DB 
                    : FORMULAS_DB.filter(f => f.category === state.category);
                
                state.currentTask = pool[Math.floor(Math.random() * pool.length)];
                state.mode = Math.floor(Math.random() * 3);
                state.selectedBlocks = [];
                
                renderUI();
                container.style.opacity = '1';
            }, 200);
        }

        function renderUI() {
            const container = document.getElementById('task-container');
            const label = document.getElementById('task-type-label');
            container.innerHTML = '';

            if (state.mode === 0) {
                label.innerText = "РЕЖИМ: НАЗВАНИЕ";
                container.innerHTML = `
                    <div class="text-center space-y-8">
                        <div class="text-sm font-bold text-blue-500 tracking-widest uppercase">Какая это формула?</div>
                        <div class="py-6 min-h-[100px] flex items-center justify-center" id="math-target"></div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
                            ${generateOptions(state.currentTask)}
                        </div>
                    </div>
                `;
                katex.render(state.currentTask.formula, document.getElementById('math-target'), { displayMode: true });
            } 
            else if (state.mode === 1) {
                label.innerText = "РЕЖИМ: КОНСТРУКТОР";
                container.innerHTML = `
                    <div class="text-center space-y-6">
                        <div class="text-sm font-bold text-blue-500 tracking-widest uppercase">Соберите компоненты:</div>
                        <h2 class="text-2xl font-bold text-slate-800 mb-6">${state.currentTask.name}</h2>
                        <div id="drop-zone" class="min-h-[90px] border-b-2 border-slate-100 flex flex-wrap justify-center items-center gap-3 p-4 bg-slate-50/50 rounded-t-3xl">
                            <span class="text-slate-300 italic text-sm" id="empty-hint">Нажимайте на блоки внизу...</span>
                        </div>
                        <div id="block-pool" class="flex flex-wrap justify-center gap-2 mt-8"></div>
                        <div class="pt-6">
                            <button onclick="checkConstructor()" class="bg-blue-600 text-white px-10 py-4 rounded-2xl font-bold shadow-lg shadow-blue-100 hover:bg-blue-700 transition-all active:scale-95">ПРОВЕРИТЬ СБОРКУ</button>
                        </div>
                    </div>
                `;
                renderBlocks();
            } 
            else {
                label.innerText = "РЕЖИМ: ПРОПУСК";
                const displayFormula = state.currentTask.formula.replace(state.currentTask.missing, "\\color{blue}{\\square}");
                container.innerHTML = `
                    <div class="text-center space-y-8">
                        <div class="text-sm font-bold text-blue-500 tracking-widest uppercase">Чего не хватает?</div>
                        <h2 class="text-xl font-semibold text-slate-600">${state.currentTask.name}</h2>
                        <div class="py-4" id="math-gap"></div>
                        <div class="flex flex-col items-center gap-4">
                            <input type="text" id="gap-input" autofocus 
                                class="border-2 border-slate-100 rounded-2xl px-6 py-4 text-center text-2xl font-mono focus:border-blue-400 focus:ring-4 focus:ring-blue-50 outline-none w-full max-w-[320px] transition-all" 
                                placeholder="Введите символ...">
                            <button onclick="checkGap()" class="w-full max-w-[320px] bg-slate-900 text-white py-4 rounded-2xl font-bold hover:bg-slate-800 transition-all active:scale-95">ОТВЕТИТЬ</button>
                        </div>
                    </div>
                `;
                katex.render(displayFormula, document.getElementById('math-gap'), { displayMode: true });
                document.getElementById('gap-input').addEventListener('keypress', e => e.key === 'Enter' && checkGap());
            }
        }

        function generateOptions(correctObj) {
            // Фильтруем пул по категории текущей формулы
            const sameCategoryPool = FORMULAS_DB.filter(f => f.category === correctObj.category && f.name !== correctObj.name);
            
            let opts = [correctObj.name];
            
            // Если в категории мало формул, берем из общего пула
            const fillPool = sameCategoryPool.length >= 3 ? sameCategoryPool : FORMULAS_DB.filter(f => f.name !== correctObj.name);
            
            const shuffledPool = fillPool.sort(() => Math.random() - 0.5);
            for (let item of shuffledPool) {
                if (opts.length >= 4) break;
                if (!opts.includes(item.name)) opts.push(item.name);
            }

            return opts.sort(() => Math.random() - 0.5).map(o => `
                <button onclick="checkOption('${o.replace(/'/g, "\\'")}')" class="bg-white border border-slate-200 p-4 rounded-2xl hover:border-blue-500 hover:bg-blue-50 transition-all text-sm font-semibold text-slate-700 active:scale-95">
                    ${o}
                </button>
            `).join('');
        }

        function renderBlocks() {
            const pool = document.getElementById('block-pool');
            let items = [...state.currentTask.parts];
            const noise = ["+", "-", "xo", "Vo", "m", "\\Delta", "v", "P", "QH", "Qx", "2", "3/2", "g", "k", "\\sin a", "\\cos a", "R", "T", "n", "U", "I"];
            while(items.length < 10) {
                let n = noise[Math.floor(Math.random() * noise.length)];
                if(!items.includes(n)) items.push(n);
            }
            items.sort(() => Math.random() - 0.5);

            pool.innerHTML = items.map(item => `
                <button onclick="addBlock('${item.replace(/'/g, "\\'")}')" class="constructor-block bg-white border border-slate-200 px-4 py-2 rounded-xl text-lg font-mono shadow-sm hover:border-blue-400 active:bg-blue-50">
                    ${item}
                </button>
            `).join('');
        }

        function addBlock(val) {
            document.getElementById('empty-hint')?.remove();
            state.selectedBlocks.push(val);
            const drop = document.getElementById('drop-zone');
            const el = document.createElement('div');
            el.className = "bg-blue-600 text-white px-3 py-1.5 rounded-lg font-mono text-lg cursor-pointer animate-in fade-in zoom-in duration-200";
            el.innerText = val;
            el.onclick = () => {
                const idx = state.selectedBlocks.lastIndexOf(val);
                if (idx > -1) state.selectedBlocks.splice(idx, 1);
                el.remove();
                if(state.selectedBlocks.length === 0) drop.innerHTML = '<span class="text-slate-300 italic text-sm" id="empty-hint">Нажимайте на блоки внизу...</span>';
            };
            drop.appendChild(el);
        }

        function checkOption(val) {
            verify(val === state.currentTask.name);
        }

        function checkGap() {
            const input = document.getElementById('gap-input').value.trim().replace(/\\/g, '').replace(/ /g, '');
            const correct = state.currentTask.missing.replace(/\\/g, '').replace(/ /g, '');
            verify(input.toLowerCase() === correct.toLowerCase());
        }

        function checkConstructor() {
            const result = state.selectedBlocks.join('').replace(/[\s\\]/g, '');
            const correct = state.currentTask.parts.join('').replace(/[\s\\]/g, '');
            verify(result === correct);
        }

        function verify(isCorrect) {
            const card = document.getElementById('main-card');
            const feedback = document.getElementById('feedback');
            const icon = document.getElementById('feedback-icon');
            const correctMsg = document.getElementById('feedback-correct');

            if (isCorrect) {
                state.score += 15;
                card.classList.add('success-flash');
                icon.innerText = "✅";
                correctMsg.innerText = "Верно!";
            } else {
                state.score = Math.max(0, state.score - 5);
                card.classList.add('error-flash');
                icon.innerText = "❌";
                correctMsg.innerHTML = `<div class="space-y-2">
                    <p class="text-slate-400">Ошибка. Правильно так:</p>
                    <div class="text-slate-800 text-2xl font-bold" id="feedback-formula-render"></div>
                </div>`;
                setTimeout(() => {
                    katex.render(state.currentTask.formula, document.getElementById('feedback-formula-render'));
                }, 0);
            }

            document.getElementById('score').innerText = state.score;
            feedback.classList.remove('hidden');
            feedback.classList.add('flex');

            setTimeout(() => {
                card.classList.remove('success-flash', 'error-flash');
                feedback.classList.add('hidden');
                feedback.classList.remove('flex');
                nextTask();
            }, isCorrect ? 900 : 3500);
        }

        window.onload = nextTask;
    </script>
</body>
</html>
